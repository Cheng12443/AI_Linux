# KAI Linux — Alertmanager 告警配置
#
# 用法：
#   alertmanager --config.file=alertmanager.yml

global:
  resolve_timeout: 5m

# 路由规则
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'webhook'

  routes:
    # 严重告警
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 0s
      repeat_interval: 5m

    # 警告
    - match:
        severity: warning
      receiver: 'webhook'

# 接收器
receivers:
  # 通用 Webhook（钉钉/飞书/Slack 可替换 URL）
  - name: 'webhook'
    webhook_configs:
      - url: 'http://localhost:9999/alert'
        send_resolved: true

  # 严重告警 Webhook
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://localhost:9999/alert/critical'
        send_resolved: true

  # 钉钉机器人（示例，需替换 access_token）
  - name: 'dingtalk'
    webhook_configs:
      - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'
        send_resolved: true

# 告警抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

