; ============================================================================
; KAI Linux — Supervisor 多进程管理配置
;
; 管理所有 KAI Linux 用户态模块：
;   - kai-gateway    Layer2 网关（DeepSeek/Kimi 路由）
;   - kai-web        Web Dashboard (8080)
;   - kai-monitor    性能监控面板 (9090)
;   - kai-ws         WebSocket 推送 (9998)
; ============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/kai-linux/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/kai-linux/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/kai-linux/supervisor.sock

[supervisorctl]
serverurl=unix:///run/kai-linux/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================================
; Layer2 网关（核心）
; ============================================================================
[program:kai-gateway]
command=/usr/local/bin/kai-gateway
directory=/opt/kai-linux/layer2
autostart=true
autorestart=true
startretries=10
startsecs=3
redirect_stderr=true
stdout_logfile=/var/log/kai-linux/gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=DEEPSEEK_API_KEY="%(ENV_DEEPSEEK_API_KEY)s",KIMI_API_KEY="%(ENV_KIMI_API_KEY)s",KAI_MODE="%(ENV_KAI_MODE)s"

; ============================================================================
; Web Dashboard (8080)
; ============================================================================
[program:kai-web]
command=/usr/local/bin/kai-web --port 8080
directory=/opt/kai-linux
autostart=true
autorestart=true
startretries=10
startsecs=3
redirect_stderr=true
stdout_logfile=/var/log/kai-linux/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=DEEPSEEK_API_KEY="%(ENV_DEEPSEEK_API_KEY)s",KIMI_API_KEY="%(ENV_KIMI_API_KEY)s"

; ============================================================================
; 性能监控面板 (9090)
; ============================================================================
[program:kai-monitor]
command=/usr/local/bin/kai-monitor --port 9090
directory=/opt/kai-linux
autostart=true
autorestart=true
startretries=10
startsecs=3
redirect_stderr=true
stdout_logfile=/var/log/kai-linux/monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ============================================================================
; WebSocket 推送 (9998)
; ============================================================================
[program:kai-ws]
command=python3 /opt/kai-linux/sdk/python/ai_ws_server.py --port 9998
directory=/opt/kai-linux
autostart=true
autorestart=true
startretries=10
startsecs=3
redirect_stderr=true
stdout_logfile=/var/log/kai-linux/ws.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=DEEPSEEK_API_KEY="%(ENV_DEEPSEEK_API_KEY)s",KIMI_API_KEY="%(ENV_KIMI_API_KEY)s"

; ============================================================================
; 日志组
; ============================================================================
[group:kai]
programs=kai-gateway,kai-web,kai-monitor,kai-ws
priority=999
