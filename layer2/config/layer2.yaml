# AI Linux Layer2 网关配置
# 仅支持 DeepSeek 和 Kimi K3（Moonshot AI）
#
# 设置环境变量：
#   export DEEPSEEK_API_KEY=sk-xxxx
#   export KIMI_API_KEY=sk-xxxx

# ===========================================================================
# 后端配置（只能选一个）
# ===========================================================================
backend:
  # 可选值: deepseek | kimi
  provider: "deepseek"

  # API 密钥（建议通过环境变量传入，不写在这里）
  # key: "sk-xxxx"

  # 密钥环境变量名
  key_env: "DEEPSEEK_API_KEY"

# ===========================================================================
# 模型选择
# ===========================================================================
model:
  # DeepSeek 模型
  #   deepseek-chat      — 通用对话（默认）
  #   deepseek-coder     — 代码专用
  #   deepseek-reasoner  — 深度推理（R1）
  #
  # Kimi K3 模型
  #   moonshot-v1-8k     — 8K 上下文（默认）
  #   moonshot-v1-32k    — 32K 上下文
  #   moonshot-v1-128k   — 128K 上下文
  name: "deepseek-chat"

# ===========================================================================
# 运行模式
# ===========================================================================
mode:
  #   async    — 异步复核（推荐）：Layer1 先执行，Layer2 异步复核
  #   sync     — 同步：Layer1 等待 Layer2 决策
  #   override — 覆盖：Layer2 完全接管决策
  type: "async"

  # 同步模式超时（毫秒）
  sync_timeout_ms: 1000

# ===========================================================================
# 路由阈值（置信度 0-10000）
# ===========================================================================
routing:
  thresholds:
    # 调度：Layer2 置信度 >= 此值时采纳
    scheduling: 7000

    # IO：网络流量分类阈值
    io: 7000

    # 安全：建议更高，安全优先
    security: 8000

  # API 不可用时的降级策略
  fallback: "layer1"   # layer1 = 回退内核推理

# ===========================================================================
# API 参数
# ===========================================================================
api:
  # 请求超时（毫秒）
  timeout_ms: 5000

  # 最大重试次数
  max_retries: 3

  # Temperature（0=确定，1=随机）
  temperature: 0.1

  # 最大输出 token
  max_tokens: 256

# ===========================================================================
# 提示词（系统提示词，中文）
# ===========================================================================
prompts:
  scheduling: |
    你是一个运行在 Linux 内核中的 AI 调度助手。
    决策选项：promote（升权）/ demote（降权）/ migrate（迁移）/ batch（批处理）/ idle（暂停）/ keep（保持）
    返回 JSON：{"decision":"选项","confidence":0-100,"reason":"中文理由"}

  io: |
    你是一个 Linux 内核网络安全分析助手。
    决策选项：drop（丢弃）/ redirect（重定向）/ alert（告警）/ pass（放行）
    返回 JSON：{"decision":"选项","confidence":0-100,"reason":"中文理由"}

  security: |
    你是一个 Linux 内核安全检测助手。
    决策选项：block（阻止）/ alert（告警）/ allow（允许）
    返回 JSON：{"decision":"选项","confidence":0-100,"reason":"中文理由"}

# ===========================================================================
# 缓存
# ===========================================================================
cache:
  enabled: true
  ttl_ms: 5000        # 缓存有效期（毫秒）
  max_entries: 4096

# ===========================================================================
# 监控
# ===========================================================================
monitoring:
  heartbeat_interval_s: 30
  log_level: "info"   # debug | info | warn | error
